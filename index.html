
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly Dictionary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Wordly Dictionary</h1>
        <p>Discover the meaning of any word.</p>
    </header>

    <main>
        <form id="search-form">
            <label for="word-input">Search for a word:</label>
            <input
                type="text"
                id="word-input"
                placeholder="Enter a word..."
                required
                aria-label="Enter a word to search"
            >
            <button type="submit">Search</button>
        </form>

        <section id="result" aria-live="polite">
            <h2 id="word-title"></h2>

            <div id="pronunciation"></div>

            <div id="audio-container"></div>

            <div id="definitions"></div>

            <div id="synonyms"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
